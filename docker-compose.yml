name: godhaar-analytics-dashboard

services:
  godhaar-analytics-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}

    image: godhaar-analytics-dashboard
    container_name: godhaar-analytics-dashboard

    expose:
      - 80

    networks:
      - godhaar-net.dev

    restart: unless-stopped

networks:
  godhaar-net.dev:
    external: true
